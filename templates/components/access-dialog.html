<dialog id="access-dialog" class="analyst-action-dialog" aria-labelledby="access-dialog-title">
<form id="access-form"><div class="dialog-heading"><h2 id="access-dialog-title">Manage user</h2><button type="button" class="console-icon-btn" data-action="accessCloseUser" aria-label="Close user form">×</button></div>
<label for="access-username">Username</label><input id="access-username" name="username" autocomplete="off" required pattern="[A-Za-z0-9][A-Za-z0-9_.@\-]{2,63}" maxlength="64" class="form-control mb-3">
<div id="access-role-fields"><label for="access-new-role">Role</label><select id="access-new-role" class="form-select mb-3"><option value="viewer">Viewer</option><option value="analyst">Analyst</option><option value="responder">Responder</option><option value="admin">Administrator</option></select><label class="mb-3"><input id="access-active" type="checkbox" checked> Account enabled</label><label for="access-new-password">New password (12–256 characters; leave blank to retain)</label><input id="access-new-password" type="password" autocomplete="new-password" minlength="12" maxlength="256" class="form-control mb-3"></div>
<label for="access-reason">Reason / approval reference</label><textarea id="access-reason" class="form-control mb-3" rows="2" minlength="3" maxlength="500" required></textarea>
<label for="access-confirm-password">Your current password</label><input id="access-confirm-password" type="password" autocomplete="current-password" required class="form-control mb-3">
<p class="text-muted">Existing sessions are revoked when access or credentials change. This does not change SOAR safety policy.</p><p id="access-error" role="alert"></p><div class="dialog-buttons"><button type="button" class="btn btn-outline-secondary" data-action="accessCloseUser">Cancel</button><button id="access-submit" type="submit" class="btn btn-cyan">Confirm and record</button></div></form>
</dialog>
