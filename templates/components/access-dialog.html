<dialog id="access-dialog" class="analyst-action-dialog" aria-labelledby="access-dialog-title">
<form id="access-form"><div class="dialog-heading"><h2 id="access-dialog-title">사용자 관리</h2><button type="button" class="console-icon-btn" data-action="accessCloseUser" aria-label="닫기">×</button></div>
<label for="access-username">사용자명</label><input id="access-username" name="username" autocomplete="off" required pattern="[A-Za-z0-9][A-Za-z0-9_.@\-]{2,63}" maxlength="64" class="form-control mb-3">
<div id="access-role-fields"><label for="access-new-role">역할</label><select id="access-new-role" class="form-select mb-3"><option value="viewer">뷰어</option><option value="analyst">분석가</option><option value="responder">대응자</option><option value="admin">관리자</option></select><label class="mb-3"><input id="access-active" type="checkbox" checked> 계정 활성</label><label for="access-new-password">새 비밀번호 (12–256자, 비우면 유지)</label><input id="access-new-password" type="password" autocomplete="new-password" minlength="12" maxlength="256" class="form-control mb-3"></div>
<label for="access-reason">사유 / 승인 근거</label><textarea id="access-reason" class="form-control mb-3" rows="2" minlength="3" maxlength="500" required></textarea>
<label for="access-confirm-password">내 현재 비밀번호</label><input id="access-confirm-password" type="password" autocomplete="current-password" required class="form-control mb-3">
<p class="text-muted">권한이나 자격 증명이 바뀌면 기존 세션은 회수됩니다. SOAR 안전 정책은 바뀌지 않습니다.</p><p id="access-error" role="alert"></p><div class="dialog-buttons"><button type="button" class="btn btn-outline-secondary" data-action="accessCloseUser">취소</button><button id="access-submit" type="submit" class="btn btn-cyan">확인 후 기록</button></div></form>
</dialog>
