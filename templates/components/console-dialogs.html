<dialog id="command-palette" class="command-palette" aria-labelledby="palette-title">
  <div class="palette-header"><i class="fa fa-magnifying-glass" aria-hidden="true"></i><label id="palette-title" for="palette-input" class="sr-only">개체·명령 검색</label><input id="palette-input" type="search" autocomplete="off" placeholder="IP, 호스트, 해시, CVE, 알림 ID… 또는 명령"/><button class="console-icon-btn" data-action="consoleClosePalette" aria-label="검색 닫기"><kbd>Esc</kbd></button></div>
  <div class="palette-scope">저장된 알림·인시던트·IOC 를 검색합니다. 알림 조회 기간은 상단 시간 범위를 따릅니다.</div>
  <div id="palette-results" class="palette-results" aria-live="polite"></div>
  <div class="palette-footer"><span><kbd>↑</kbd><kbd>↓</kbd> 이동</span><span><kbd>↵</kbd> 열기</span><span>증거는 항상 손 닿는 곳에.</span></div>
</dialog>
<dialog id="investigation-drawer" class="investigation-drawer" aria-labelledby="investigation-title">
  <header class="investigation-header"><div><div class="eyebrow" id="investigation-reference">조사</div><h2 id="investigation-title">증거 불러오는 중…</h2></div><button class="console-icon-btn" data-action="consoleCloseInvestigation" aria-label="조사 창 닫기"><i class="fa fa-xmark"></i></button></header>
  <div id="investigation-meta" class="investigation-meta"></div>
  <nav class="investigation-tabs" aria-label="조사 섹션"><button class="active" data-action="consoleInvestigationTab" data-args='["evidence","@el"]'>증거</button><button data-action="consoleInvestigationTab" data-args='["timeline","@el"]'>타임라인</button><button data-action="consoleInvestigationTab" data-args='["copilot","@el"]'>분석 코파일럿</button><button data-action="consoleInvestigationTab" data-args='["response","@el"]'>대응 · 감사</button></nav>
  <div class="investigation-scroll" id="investigation-content" tabindex="0"></div>
  <footer class="investigation-footer" id="investigation-actions"></footer>
</dialog>
<dialog id="analyst-action-dialog" class="analyst-action-dialog" aria-labelledby="analyst-action-title">
  <form id="analyst-action-form"><div class="dialog-heading"><h2 id="analyst-action-title">분석가 조치 기록</h2><button type="button" class="console-icon-btn" data-action="consoleCancelAction" aria-label="취소"><i class="fa fa-xmark"></i></button></div><p id="analyst-action-description"></p><label for="analyst-action-reason">조사 메모 / 근거</label><textarea id="analyst-action-reason" rows="4" minlength="3" maxlength="500" required placeholder="이 판단을 뒷받침하는 근거를 적어 주세요."></textarea><p class="text-muted">조치와 메모는 감사 로그에 기록됩니다. 알림 증거는 보존됩니다.</p><p id="analyst-action-error" role="alert"></p><div class="dialog-buttons"><button type="button" class="btn btn-outline-secondary" data-action="consoleCancelAction">취소</button><button type="submit" class="btn btn-cyan" id="analyst-action-submit">조치 기록</button></div></form>
</dialog>
