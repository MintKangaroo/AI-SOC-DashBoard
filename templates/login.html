<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg"/>
  <!-- 홈 화면 바로가기(iOS Safari 는 apple-touch-icon PNG 만 쓴다 — SVG·manifest 아이콘은 무시) -->
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png"/>
  <link rel="manifest" href="/static/site.webmanifest"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="SOC"/>
  <meta name="theme-color" content="#0b0f13"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign in · TRACE Security Operations</title>
  <link href="/static/vendor/fontawesome/css/all.min.css" rel="stylesheet"/>
  <link href="/static/css/style.css" rel="stylesheet"/>
  <link href="/static/css/login.css" rel="stylesheet"/>
</head>
<body class="trace-login">
  <div class="login-identity" aria-hidden="true"><span class="login-wordmark">TRACE</span><div><span class="login-eyebrow">AI-ASSISTED SECURITY OPERATIONS</span><h1>Evidence decides.</h1><p>Investigate with context.<br/>Respond with confidence.</p></div><span class="login-art-note">Abstract artwork · no operational data</span></div>
  <form class="login-card" method="POST" action="/login">
    <div class="brand">
      <div class="login-eyebrow">TRACE / ANALYST WORKSPACE</div><h1>Sign in to security operations</h1><p>증거를 확인하고, 판단을 기록하세요.</p>
    </div>

    <label for="username">사용자명</label>
    <input type="text" id="username" name="username" autocomplete="username" autofocus required/>

    <label for="password">비밀번호</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required/>

    <button type="submit"><i class="fa fa-right-to-bracket me-2"></i>로그인</button>

    {% if error %}<div class="error"><i class="fa fa-triangle-exclamation me-1"></i>{{ error }}</div>{% endif %}

    <div class="foot">인가된 사용자만 접근할 수 있습니다.</div>
  </form>
</body>
</html>
