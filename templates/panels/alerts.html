<section id="panel-alerts" class="panel-section d-none">
  <div class="panel-title d-flex align-items-center flex-wrap gap-2"><h1 class="fs-h2 mb-0"><i class="fa fa-triangle-exclamation text-danger me-2"></i>위협 알림</h1><button class="btn btn-xs btn-outline-secondary ms-auto" data-action="showPanel" data-args='["alert-history"]'>알림 이력 검색</button><button class="btn btn-xs btn-outline-cyan" data-action="consoleLoadQueue" data-args='[true]'>새로고침</button></div>
  <div class="queue-views" aria-label="큐 보기"><button class="active" data-action="consoleQueueView" data-args='["open"]'>미처리 알림</button><button data-action="consoleQueueView" data-args='["critical"]'>CRITICAL</button><button data-action="consoleQueueView" data-args='["high"]'>HIGH</button><button data-action="consoleQueueView" data-args='["ack"]'>확인됨</button><button data-action="consoleQueueView" data-args='["all"]'>전체 알림</button></div>
  <div class="queue-toolbar"><input type="search" id="queue-search" aria-label="알림 증거 검색" placeholder="IP·호스트·룰·프로세스·해시·CVE 검색…" maxlength="200" data-action-enter="consoleLoadQueue" data-args='[true]'/><select id="queue-severity" aria-label="심각도" data-action-change="consoleLoadQueue" data-args='[true]'><option value="">전체 심각도</option><option>CRITICAL</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option><option>INFO</option></select><select id="queue-status" aria-label="상태" data-action-change="consoleLoadQueue" data-args='[true]'><option value="OPEN">미처리</option><option value="ACK">확인됨</option><option value="CLOSED">종료</option><option value="">전체 상태</option></select><select id="queue-origin" aria-label="데이터 출처" data-action-change="consoleLoadQueue" data-args='[true]'><option value="">전체 출처</option><option>REAL</option><option>DEMO</option><option>SYNTHETIC</option><option>SIMULATED</option><option>EXPERIMENTAL</option><option>UNAVAILABLE</option></select><select id="queue-order" aria-label="정렬" data-action-change="consoleLoadQueue" data-args='[true]'><option value="priority">우선순위순</option><option value="newest">최신순</option><option value="oldest">오래된순</option><option value="confidence">신뢰도순</option></select><button class="btn btn-outline-secondary" data-action="consoleLoadQueue" data-args='[true]' aria-label="큐 검색 실행"><i class="fa fa-search"></i></button></div>
  <div class="queue-toolbar"><input id="queue-source" aria-label="탐지 소스" placeholder="소스 (정확히 일치)" maxlength="200" data-action-enter="consoleLoadQueue" data-args='[true]'/><input id="queue-rule" aria-label="룰 ID" placeholder="룰 ID (정확히 일치)" maxlength="200" data-action-enter="consoleLoadQueue" data-args='[true]'/><select id="queue-confidence" aria-label="최소 탐지 신뢰도" data-action-change="consoleLoadQueue" data-args='[true]'><option value="0">신뢰도 무관</option><option value="50">≥ 50%</option><option value="75">≥ 75%</option><option value="95">≥ 95%</option></select><select id="queue-saved" aria-label="저장된 보기" data-action-change="consoleRestoreView" data-args='["@el"]'><option value="">저장된 보기 (이 브라우저)</option></select><button class="btn btn-sm btn-outline-secondary" data-action="consoleSaveView">보기 저장</button><details class="queue-column-control"><summary>열 표시 <i class="fa fa-sliders ms-1"></i></summary><div><label><input type="checkbox" checked data-action-change="consoleToggleColumn" data-args='["confidence","@el"]'/>신뢰도</label><label><input type="checkbox" checked data-action-change="consoleToggleColumn" data-args='["source","@el"]'/>소스</label><label><input type="checkbox" checked data-action-change="consoleToggleColumn" data-args='["rule","@el"]'/>룰</label><label><input type="checkbox" checked data-action-change="consoleToggleColumn" data-args='["technique","@el"]'/>MITRE</label><label><input type="checkbox" checked data-action-change="consoleToggleColumn" data-args='["assignee","@el"]'/>담당자</label></div></details></div>
  <div class="console-card"><div class="queue-bulk"><label><input type="checkbox" id="queue-select-all" aria-label="표시된 알림 전체 선택" data-action-change="consoleSelectAll" data-args='["@el"]'/> <span id="queue-selected">0건 선택</span></label><button class="btn btn-sm btn-outline-secondary" data-action="consoleBulkAction" data-args='["ACK"]'>확인(ACK)</button><button class="btn btn-sm btn-outline-secondary" data-action="consoleBulkAction" data-args='["CLOSED"]'>사유 입력 후 종료</button><button class="text-link ms-auto" id="queue-new-events" data-action="consoleLoadQueue" data-args='[true]'>실시간 · 행 고정</button></div><div class="console-table-wrap"><table class="console-table" id="console-queue-table"><thead><tr><th><span class="sr-only">선택</span></th><th scope="col">심각도</th><th scope="col" draggable="false">탐지 / 대상</th><th scope="col" class="col-confidence">신뢰도</th><th scope="col">상태</th><th scope="col">출처</th><th scope="col" class="col-source">소스</th><th scope="col" class="col-rule">룰</th><th scope="col" class="col-technique">MITRE</th><th scope="col" class="col-assignee">담당자</th><th scope="col">탐지 시각</th></tr></thead><tbody id="console-queue-rows"><tr><td colspan="11"><div class="console-empty">분석가 큐 불러오는 중…</div></td></tr></tbody></table></div><div class="console-card-footer"><span id="queue-pagination">저장된 증거 대기 중</span><span><button class="btn btn-xs btn-outline-secondary" id="queue-prev" data-action="consoleQueuePage" data-args='[-1]'>이전</button> <button class="btn btn-xs btn-outline-secondary" id="queue-next" data-action="consoleQueuePage" data-args='[1]'>다음</button></span></div></div>
  <details class="console-legacy" id="console-suppressed"><summary data-action="loadSuppressed" data-args='[1]'>억제·중복 병합된 원본 <span class="provenance provenance-mixed">MIXED SOURCES</span></summary><div id="tab-alerts-suppressed">
<div class="row g-2 mb-2">
            <div class="col-sm-2"><div class="stat-card border-cyan">
              <div class="stat-value text-cyan fs-kpi-sm" id="dedup-seen">0</div>
              <div class="stat-label">평가된 이벤트</div></div></div>
            <div class="col-sm-2"><div class="stat-card border-purple">
              <div class="stat-value text-purple fs-kpi-sm" id="dedup-merged-count">0</div>
              <div class="stat-label">중복 병합</div></div></div>
            <div class="col-sm-2"><div class="stat-card border-warning">
              <div class="stat-value text-warning fs-kpi-sm" id="dedup-reduction">0%</div>
              <div class="stat-label">총 감축률</div></div></div>
            <div class="col-sm-2"><div class="stat-card border-danger">
              <div class="stat-value text-danger fs-kpi-sm" id="dedup-storms">0</div>
              <div class="stat-label">스톰 발생</div></div></div>
            <div class="col-sm-2"><div class="stat-card border-secondary">
              <div class="stat-value fs-kpi-sm text-dim" id="dedup-window">-</div>
              <div class="stat-label">병합 윈도우</div></div></div>
            <div class="col-sm-2 d-flex align-items-center">
              <select class="form-select form-select-sm bg-dark text-white border-secondary"
                      id="supp-kind-filter" aria-label="억제 종류로 거르기" data-action-change="loadSuppressed" data-args='[1]'>
                <option value="">전체 종류</option>
                <option value="duplicate">중복 병합</option>
                <option value="suppressed">규칙 억제</option>
                <option value="storm">스톰</option>
              </select>
            </div>
          </div>
          <div class="small text-muted px-1 pb-1 fs-label">
            병합·억제된 이벤트는 삭제되지 않고 원문째 보관됩니다.
            CRITICAL 은 억제 규칙 대상에서 제외되며, 중복 병합만 적용됩니다(정보 손실 없음).
          </div>
          <div class="card-panel p-0">
            <div class="table-responsive scroll-y scroll-y-xl">
              <table class="table table-dark table-hover table-sm mb-0 fs-sm">
                <thead><tr>
                  <th>시각</th><th>종류</th><th>심각도</th><th>유형</th>
                  <th>출발지</th><th>설명</th><th>사유</th><th>병합 대상</th>
                </tr></thead>
                <tbody id="suppressed-tbody">
                  <tr><td colspan="8" class="text-muted text-center p-3">억제됨 탭을 열면 조회합니다</td></tr>
                </tbody>
              </table>
            </div>
          </div>
          <div class="small text-muted mt-1" id="supp-summary"></div>
</div></details></section>
